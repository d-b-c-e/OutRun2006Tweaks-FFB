# Force-feedback profiles — dbce-wheel-mod-toolkit
#
# Every parameter that decides how a game FEELS, as data. Ships beside the game
# and is read at runtime, so a tune can be changed or swapped without rebuilding
# anything: edit a number, or point the game's config at a different profile,
# and restart it.
#
#   name@version   is the id a game names in its own config, e.g.
#                  FFBProfile = arcade-outrun@1
#
# RULES
#
#   1. A published version is IMMUTABLE. Editing arcade-outrun@1 makes every
#      earlier note about how it drove into a lie. Add @2 instead.
#   2. `inherits` lets a new version state only what it changes, so the diff
#      between two tunes IS the list of what you changed.
#   3. Put your own tunes in force-profiles.user.ini beside this file. That one
#      is never overwritten when the toolkit is updated; this one is.
#   4. An unknown key is reported, not ignored — a typo in a tuning file that
#      silently does nothing is the worst possible outcome.
#
# UNITS
#   strengths      normalised, 1.0 = full scale output for that term alone
#   speeds         m/s unless the key says Kmh
#   seconds, hz    literal
#   shaper.strength 0-100, 50 = unity gain (the slider midpoint is the tune)
#
# Which term does what is documented on ForceModelSettings and ForceShaper.


# ---------------------------------------------------------------------------
# arcade-outrun@1 — OutRun 2006, the constants the game shipped with.
# ---------------------------------------------------------------------------
# Transcribed from OutRun2006Tweaks-FFB's own defaults (src/plugin.hpp, as
# validated at a MOZA R12 on 2026-08-11), so the first drive on the shared model
# is a fair comparison against what the game did before.
#
# Not bit-identical, and two differences are worth knowing before you judge it:
#
#   * The spring's speed curve differs in shape. OutRun used
#     min(1, s/0.25) x (0.35 + 0.65 s) on a normalised speed; the shared model
#     uses a single "full authority at" speed. 22.5 m/s is the closest fit
#     (OutRun's 0.25 of a ~90 m/s top speed) but the knee is softer here.
#   * OutRun's lateral term is a game-specific signal with its own deadzone and
#     /24 normalisation. That extraction stays in the game; only the shaping is
#     shared.
#
[arcade-outrun@1]
description = OutRun 2006 centre-out, constants as shipped 2026-08-11

model.spring.strength          = 0.45
model.spring.fullSpeedMps      = 22.5
model.damper.strength          = 0.10
model.damper.staticFraction    = 0.4
model.lateral.weight           = 0.55
model.lateral.forceReference   = 11500
model.lateral.gReference       = 1.0
model.lateral.trailFloor       = 1.0     # no trail term; OutRun lightens via gripLoss instead
model.lateral.trailSlipSpan    = 2.0
model.lateral.gripLoss         = 0.6
model.load.weightTransfer      = 0.8
model.load.transferMin         = -0.20
model.load.transferMax         = 0.30
model.texture.strength         = 0.6
model.texture.hz               = 12
model.impact.strength          = 1.0
model.impact.seconds           = 0.167   # OutRun: 10 frames of active jolt at 60 Hz
model.shift.strength           = 0.3
model.shift.seconds            = 0.05    # OutRun: 3 frames each way

shaper.strength                = 50
shaper.invert                  = false
shaper.deadzone                = 0
shaper.attackSmoothing         = 0.25    # OutRun's dual-rate EMA on the lateral signal
shaper.decaySmoothing          = 0.20
shaper.softSaturation          = 1.0     # tanh
shaper.slewPerSecond           = 3.6     # OutRun: 600 of 10000 per frame at 60 Hz
shaper.outputDeadband          = 0.0015  # OutRun: skip an update under 15 of 10000
shaper.fadeStartKmh            = 0       # no low-speed fade; the spring already scales with speed
shaper.fadeFullKmh             = 0
shaper.rampSeconds             = 0.5     # OutRun's 30-frame warm-up
shaper.peakLimit               = 1.0


# ---------------------------------------------------------------------------
# arcade-outrun@2 — a lighter, less springy variant to drive against @1.
# ---------------------------------------------------------------------------
# The hypothesis worth testing first: OutRun's steering signal is mis-scaled
# (see knowledge/games/outrun-2006.md), so the spring and damper have never
# really been felt, and the tuning above compensated with a heavy lateral term.
# If the steering field turns out to be one of the larger ones, @1 will feel
# harsh and this should feel closer to the cabinet.
#
[arcade-outrun@2]
description = OutRun, lighter lateral and a spring that actually carries the centre
inherits = arcade-outrun@1

model.spring.strength          = 0.60
model.lateral.weight           = 0.35
model.load.weightTransfer      = 0.50
shaper.slewPerSecond           = 5.0


# ---------------------------------------------------------------------------
# simlite@1 - SUPERSEDED BY simlite@2. Its MODEL half is art of rally's; its
# shaper half is not.
# ---------------------------------------------------------------------------
# Kept because a published version is immutable and reports about it must stay
# true. The claim "this is art of rally's tuning" was only half right, and a
# conformance vector generated from that mod's own shipping code
# (dotnet/Dbce.Wheel.Ffb.Tests/data/) showed which half: the deadzone, output
# deadband and ramp below are THIS repo's ForceShaper defaults, which the game
# does not use. Use simlite@2.
#
# The model half, unchanged and correct: lateral tyre force through a pneumatic
# trail that shrinks toward the limit, no virtual spring. The reference force
# was retuned from 8,000 to 11,500 N on 2026-09-04 after the default came back
# 30% too strong at a MOZA R12.
#
[simlite@1]
description = art of rally, lateral force x trail, no spring (0.2.2 defaults)

model.spring.strength          = 0
model.spring.fullSpeedMps      = 30
model.damper.strength          = 0
model.damper.staticFraction    = 0.4
model.lateral.weight           = 1.0
model.lateral.forceReference   = 11500
model.lateral.gReference       = 1.2
model.lateral.trailFloor       = 0.6
model.lateral.trailSlipSpan    = 2.0
model.lateral.gripLoss         = 0
model.load.weightTransfer      = 0
model.load.transferMin         = -0.20
model.load.transferMax         = 0.30
model.texture.strength         = 0
model.texture.hz               = 12
model.impact.strength          = 0
model.impact.seconds           = 0.12
model.shift.strength           = 0
model.shift.seconds            = 0.04

shaper.strength                = 50
shaper.invert                  = false
shaper.deadzone                = 0.0015
shaper.attackSmoothing         = 0.2
shaper.decaySmoothing          = 0.2
shaper.softSaturation          = 0
shaper.slewPerSecond           = 0
shaper.outputDeadband          = 0.0015
shaper.fadeStartKmh            = 3
shaper.fadeFullKmh             = 12
shaper.rampSeconds             = 0.25
shaper.peakLimit               = 1.0


# ---------------------------------------------------------------------------
# simlite@2 - art of rally 0.2.2, corrected against its own force curve.
# ---------------------------------------------------------------------------
# Every value here is evidenced by the conformance vector in
# dotnet/Dbce.Wheel.Ffb.Tests/data/art-of-rally-0.2.2-force-curve.csv, which
# that repo generated from its shipping ForceCurve.cs rather than by
# transcription. SimLiteVectorTests holds this profile to it.
#
# What changed from @1, and why: the shaper conditioning is off, not defaulted.
# The curve shows no deadzone (500 N at 5 km/h gives 0.005487, undiminished),
# no output deadband (it sends 54, not 0), no soft saturation and no slew. The
# smoothing is one SYMMETRIC coefficient shipped at 0.2, so attack and decay
# are equal here - they have to be for the two implementations to agree at all.
#
# Two conventions to know before comparing numbers by hand. This model returns a
# NEGATIVE force for a positive lateral load, because positive means "toward
# positive steer" and centring is the opposite. And art of rally fades then
# clamps, while this pipeline clamps in the model and fades in the shaper; the
# two agree everywhere except when the force exceeds full scale AND the speed
# fade is partial, i.e. a low-speed slide. See ClampOrderDiffersAndIsMeasured.
#
[simlite@2]
description = art of rally 0.2.2, verified against its own force curve

model.spring.strength          = 0
model.spring.fullSpeedMps      = 30
model.damper.strength          = 0
model.damper.staticFraction    = 0.4
model.lateral.weight           = 1.0
model.lateral.forceReference   = 11500
model.lateral.gReference       = 1.2
model.lateral.trailFloor       = 0.6
model.lateral.trailSlipSpan    = 2.0
model.lateral.gripLoss         = 0
model.load.weightTransfer      = 0
model.load.transferMin         = -0.20
model.load.transferMax         = 0.30
model.texture.strength         = 0
model.texture.hz               = 12
model.impact.strength          = 0
model.impact.seconds           = 0.12
model.shift.strength           = 0
model.shift.seconds            = 0.04

shaper.strength                = 50      # gain 1.0
shaper.invert                  = false
shaper.deadzone                = 0       # the curve shows none
shaper.attackSmoothing         = 0.2     # one symmetric coefficient, so both
shaper.decaySmoothing          = 0.2     # halves must match
shaper.softSaturation          = 0
shaper.slewPerSecond           = 0
shaper.outputDeadband          = 0
shaper.fadeStartKmh            = 3
shaper.fadeFullKmh             = 12
shaper.rampSeconds             = 0
shaper.peakLimit               = 1.0


